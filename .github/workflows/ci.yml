name: CI

# One pipeline, in the order the project runs things: unit tests, then the
# image, then a vulnerability scan, and only then a push. A PR runs every
# step except the push, so nothing reaches GHCR that has not been tested
# and scanned first.
on:
  push:
    branches: ['master']
    tags: ['v*.*.*']
  pull_request:
    branches: ['master']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Types
        run: npm run check

      # No database here on purpose: these are the pure units (taxonomy,
      # geo, form parsing, tokens). Anything needing Postgres belongs in a
      # separate job with a service container, not in the fast gate.
      - name: Unit tests
        run: npm test

  integration:
    name: Integration tests
    needs: test
    runs-on: ubuntu-latest
    services:
      # Empty database, same major version as production. The bootstrap
      # gate is the one part of a deploy that can leave a half-migrated
      # database serving traffic, and it only exists against a real server.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/rehearsal
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  image:
    name: Build, scan, push
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # latest + branch on the default branch, semver on a vX.Y.Z tag, and
      # the short sha on everything, so an image is always traceable back
      # to the commit it came from. The labels are the OCI annotation set:
      # revision, source, version and created, plus title/description off
      # the repository.
      - name: Derive tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.title=probes
            org.opencontainers.image.description=Board where bands post who they are missing
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # Built once into the local daemon so Trivy has something to scan.
      # The push below reuses this exact cache, so it is not a second build.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          # Nothing to do about a CVE with no fix yet, and failing on one
          # only teaches people to ignore this job.
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is what you deploy. A tag can be moved, this cannot.
      - name: Report digest
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
